<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animated Login Page</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      background: linear-gradient(45deg, #1d2b64, #f8cdda);
      animation: gradientBG 15s ease infinite;
      background-size: 400% 400%;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      width: 300px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background-color: #6a11cb;
      background-image: linear-gradient(315deg, #6a11cb 0%, #2575fc 74%);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .toggle {
      text-align: center;
      margin-top: 10px;
      cursor: pointer;
      text-decoration: underline;
      font-size: 14px;
    }

    .error {
      color: #ff6b6b;
      font-size: 14px;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="container" id="loginContainer">
  <h2 id="formTitle">Login</h2>
  <input type="text" id="username" placeholder="Username" required>
  <input type="password" id="password" placeholder="Password" required>
  <button onclick="handleSubmit()">Login</button>
  <div class="toggle" onclick="toggleForm()">Don't have an account? Create one</div>
  <div class="error" id="errorMessage"></div>
</div>

<script>
  let isLogin = true; // Track form mode

  function toggleForm() {
    isLogin = !isLogin;
    document.getElementById('formTitle').innerText = isLogin ? 'Login' : 'Create Account';
    document.querySelector('button').innerText = isLogin ? 'Login' : 'Register';
    document.querySelector('.toggle').innerText = isLogin ? "Don't have an account? Create one" : "Already have an account? Login";
    document.getElementById('errorMessage').innerText = "";
  }

  function handleSubmit() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorMessage = document.getElementById('errorMessage');

    if (username === "" || password === "") {
      errorMessage.innerText = "Please fill all fields!";
      return;
    }

    if (isLogin) {
      // Login logic
      const storedPassword = localStorage.getItem(username);

      if (storedPassword && storedPassword === password) {
        // Successful login - redirect to home page
        errorMessage.style.color = "#00ff00";
        errorMessage.innerText = "Login successful!";
        setTimeout(function() {
          window.location.href = "a2.html"; // Redirect to home page after a short delay
        }, 1500); // Delay the redirection slightly to show success message
      } else {
        errorMessage.innerText = "Invalid username or password!";
      }
    } else {
      // Registration logic
      if (localStorage.getItem(username)) {
        errorMessage.innerText = "Username already exists!";
      } else {
        localStorage.setItem(username, password);
        errorMessage.style.color = "#00ff00";
        errorMessage.innerText = "Account created! You can now log in.";
        toggleForm();
      }
    }
  }
</script>

</body>
</html>
